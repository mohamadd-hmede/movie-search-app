<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Search App</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Movie Search</h1>
      <p>Search For Movies, Series, and Episodes.</p>
    </header>

    <main>
      <form id="search-form">
        <div>
          <label for="search-input">Movie title</label>
          <input
            id="search-input"
            type="text"
            placeholder="Enter a movie title"
            required
          />
          <button type="submit">Search</button>
        </div>
      </form>

      <section id="welcome-section">
        <h2>🎬 Start Exploring Movies</h2>
        <p>
          Search for your favorite movies, TV series, or episodes using the OMDb
          API. Click <strong>View Details</strong> to see ratings, genre, plot,
          cast, runtime, release date, and more.
        </p>
      </section>

      <div id="status">
        <div id="loading-spinner" class="spinner"></div>
        <p id="message"></p>
      </div>

      <section id="movie-results"></section>
    </main>

    <div id="movie-modal" class="modal">
      <div class="modal-content">
        <span id="close-modal">&times;</span>

        <div id="modal-body"></div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
